<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Valo Drinks is a fan concept for a drinks brand inspired by the agents of VALORANT."
    />
    <title>Valo Drinks</title>
    <link rel="icon" href="/src/assets/images/logo.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- media="print" stops the font file blocking the first paint. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton+SC&family=Poppins:wght@400;600&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <script>
      // Decided before the first paint, so a refresh never flashes the intro.
      (function () {
        var seen = true;
        try {
          seen = sessionStorage.getItem('valo-intro-seen') === '1';
        } catch (error) {
          // Storage is blocked, so we couldn't remember. Skip it rather than play every time.
        }
        var reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!seen && !reducedMotion) document.documentElement.classList.add('intro');
      })();
    </script>
    <style>
      html.intro {
        overflow: hidden;
      }

      #intro {
        display: none;
      }

      html.intro #intro {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: block;
        background: #0f1923;
        transition: opacity 0.6s ease;
      }

      html.intro #intro.intro-done {
        opacity: 0;
      }

      #intro video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #intro button {
        position: absolute;
        right: 16px;
        bottom: 16px;
        min-height: 44px;
        padding-inline: 16px;
        border: 0;
        border-radius: 6px;
        background: rgb(0 0 0 / 65%);
        color: #fff;
        font: 600 1rem system-ui, sans-serif;
        cursor: pointer;
      }

      #intro button:hover {
        background: #000;
      }

      #intro button:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="intro"></div>
    <div id="root"></div>
    <script>
      // Added here, not in the HTML, so the video only downloads when it's going to play.
      (function () {
        var html = document.documentElement;
        if (!html.classList.contains('intro')) return;

        var intro = document.getElementById('intro');
        var root = document.getElementById('root');
        var video = document.createElement('video');
        video.src = '%BASE_URL%intro.mp4';
        video.muted = true;
        video.playsInline = true;
        video.autoplay = true;
        video.setAttribute('aria-hidden', 'true');
        intro.appendChild(video);
        root.inert = true;

        // If the app never starts, don't leave visitors stuck behind the video.
        setTimeout(function () {
          if (intro.dataset.running) return;
          intro.remove();
          root.inert = false;
          html.classList.remove('intro');
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
